name: QA CI

# GitHub에 Push하면 자동 실행
on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소의 코드를 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. 필요한 Python 라이브러리 설치
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 4. Selenium 장바구니 테스트 실행
      - name: Run Web UI Test
        run: python -m pytest pytest_pom_tests/test_pytest_cart_pom.py -v

      # 5. Node.js 실행 환경 준비
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 6. Newman 설치
      - name: Install Newman
        run: npm install -g newman

      # 7. Postman Collection 실행
      - name: Run API Test
        run: newman run "api_tests/JSONPlaceholder API Test.postman_collection.json"